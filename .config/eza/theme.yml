# Luna, by role from luna.nvim's palette (lua/luna/palette.lua); file kinds
# match yazi's theme.toml.
colourful: true

filekinds:
  normal: { foreground: "#e4e4e8" }
  directory: { foreground: "#75a1c7" }
  symlink: { foreground: "#b09080" }
  pipe: { foreground: "#7c7c7c" }
  block_device: { foreground: "#c2916a" }
  char_device: { foreground: "#c2916a" }
  socket: { foreground: "#7c7c7c" }
  special: { foreground: "#c4a8d6" }
  executable: { foreground: "#6fbe80" }
  mount_point: { foreground: "#8c9cb8" }

perms:
  user_read: { foreground: "#c2916a" }
  user_write: { foreground: "#b09080" }
  user_execute_file: { foreground: "#6fbe80" }
  user_execute_other: { foreground: "#6fbe80" }
  group_read: { foreground: "#c2916a" }
  group_write: { foreground: "#d9a35a" }
  group_execute: { foreground: "#6fbe80" }
  other_read: { foreground: "#c2916a" }
  other_write: { foreground: "#e08585" }
  other_execute: { foreground: "#6fbe80" }
  special_user_file: { foreground: "#e08585" }
  special_other: { foreground: "#e08585" }
  attribute: { foreground: "#7c7c7c" }

size:
  major: { foreground: "#8c9cb8" }
  minor: { foreground: "#c4a8d6" }
  number_byte: { foreground: "#c7c7c7" }
  number_kilo: { foreground: "#8c9cb8" }
  number_mega: { foreground: "#75a1c7" }
  number_giga: { foreground: "#d9a35a" }
  number_huge: { foreground: "#e08585" }
  unit_byte: { foreground: "#c7c7c7" }
  unit_kilo: { foreground: "#8c9cb8" }
  unit_mega: { foreground: "#75a1c7" }
  unit_giga: { foreground: "#d9a35a" }
  unit_huge: { foreground: "#e08585" }

users:
  user_you: { foreground: "#75a1c7" }
  user_root: { foreground: "#c4a8d6" }
  user_other: { foreground: "#8c9cb8" }
  group_yours: { foreground: "#8c9cb8" }
  group_root: { foreground: "#c4a8d6" }
  group_other: { foreground: "#e4e4e8" }

links:
  normal: { foreground: "#8c9cb8" }
  multi_link_file: { foreground: "#75a1c7" }

git:
  new: { foreground: "#6fbe80" }
  modified: { foreground: "#c2916a" }
  deleted: { foreground: "#e08585" }
  renamed: { foreground: "#8c9cb8" }
  typechange: { foreground: "#8c9cb8" }
  ignored: { foreground: "#7c7c7c" }
  conflicted: { foreground: "#d9a35a" }

git_repo:
  branch_main: { foreground: "#888888" }
  branch_other: { foreground: "#8c9cb8" }
  git_clean: { foreground: "#404040" }
  git_dirty: { foreground: "#c2916a" }

security_context:
  colon: { foreground: "#7c7c7c" }
  user: { foreground: "#888888" }
  role: { foreground: "#8c9cb8" }
  typ: { foreground: "#75a1c7" }
  range: { foreground: "#c4a8d6" }

file_type:
  image: { foreground: "#c7c7c7" }
  video: { foreground: "#c7c7c7" }
  music: { foreground: "#c7c7c7" }
  lossless: { foreground: "#c7c7c7" }
  crypto: { foreground: "#e08585" }
  document: { foreground: "#75a1c7" }
  compressed: { foreground: "#e08585" }
  temp: { foreground: "#7c7c7c" }
  compiled: { foreground: "#888888" }
  build: { foreground: "#6fbe80" }
  source: { foreground: "#c4a8d6" }

punctuation: { foreground: "#404040" }
date: { foreground: "#c2916a" }
inode: { foreground: "#888888" }
blocks: { foreground: "#888888" }
header: { foreground: "#c7c7c7" }
octal: { foreground: "#e19067" }
flags: { foreground: "#c4a8d6" }

symlink_path: { foreground: "#8c9cb8" }
control_char: { foreground: "#e19067" }
broken_symlink: { foreground: "#e08585" }
broken_path_overlay: { foreground: "#e08585" }
