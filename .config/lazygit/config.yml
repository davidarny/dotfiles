git:
  overrideGpg: true

gui:
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - "#75a1c7"
      - bold
    inactiveBorderColor:
      - "#404040"
    optionsTextColor:
      - "#75a1c7"
    selectedLineBgColor:
      - "#212121"
    selectedRangeBgColor:
      - "#212121"
    cherryPickedCommitBgColor:
      - "#c4a8d6"
    cherryPickedCommitFgColor:
      - "#75a1c7"
    unstagedChangesColor:
      - "#e08585"
    defaultFgColor:
      - "#e4e4e8"
    searchingActiveBorderColor:
      - "#d9a35a"
      - bold

customCommands:
  - key: "<c-i>"
    context: global
    command: "git submodule update --init --recursive"
    description: "Initialize and update submodules"
    loadingText: "Initializing submodules"
    output: log
  - key: "<c-u>"
    context: global
    command: "git submodule update --remote --recursive"
    description: "Update submodules from remotes"
    loadingText: "Updating submodules"
    output: log
  - key: "<c-p>"
    context: global
    command: "git submodule foreach --recursive 'git pull --ff-only'"
    description: "Pull all submodules"
    loadingText: "Pulling submodules"
    output: log
  - key: "<c-y>"
    context: localBranches
    command: |
      sh -c '
        git fetch --all --prune || exit 1
        wt="$(git worktree list --porcelain | sed -n "s#^branch refs/heads/##p")"
        git for-each-ref --format="%(refname:short) %(upstream:short)" refs/heads/ | while read -r br up; do
          [ -z "$up" ] && continue
          case " $wt " in *" $br "*) continue ;; esac
          git rev-parse -q --verify "$up" >/dev/null || continue
          [ "$(git rev-parse "$br")" = "$(git rev-parse "$up")" ] && continue
          echo "updated $br -> $up"
          git branch -f "$br" "$up"
        done
        git symbolic-ref -q HEAD >/dev/null && git merge --ff-only @{u} 2>/dev/null
        true
      '
    description: "Sync local branches with upstreams"
    loadingText: "Syncing local branches"
    output: log
  - key: "<c-d>"
    context: localBranches
    command: |
      sh -c '
        git fetch -q origin master
        git branch --merged origin/master | grep "^  MST-" | sed "s/^[ *]*//" | while read -r branch; do
          git branch -d "$branch"
        done
      '
    description: "Prune merged MST branches"
    loadingText: "Pruning merged MST branches"
    output: log
  - key: "<c-g>"
    context: "commits, subCommits"
    command: |
      sh "$HOME/.config/lazygit/regenerate-commits.sh" \
        {{.SelectedCommitRange.From | quote}} \
        {{.SelectedCommitRange.To | quote}} \
        {{.Form.AuthorName | quote}} \
        {{.Form.AuthorEmail | quote}}
    description: "Regenerate commit author and committer"
    loadingText: "Regenerating commit identities"
    output: log
    prompts:
      - type: input
        title: "New author name"
        key: "AuthorName"
        initialValue: '{{ runCommand "git config --get user.name" }}'
        suggestions:
          preset: "authors"
      - type: input
        title: "New author email"
        key: "AuthorEmail"
        initialValue: '{{ runCommand "git config --get user.email" }}'
        suggestions:
          command: "git log --format='%ae' | sort -u"
      - type: confirm
        title: "Rewrite history"
        body: "Rewrite all commits, or the selected commit range, with this identity?"
