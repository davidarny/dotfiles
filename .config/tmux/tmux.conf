# ══════════════════════════════════════════════════════════════════════════════
# Tmux Configuration - Luna Theme
# ══════════════════════════════════════════════════════════════════════════════

# ─── General ──────────────────────────────────────────────────────────────────

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"
set -g history-limit 10000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g escape-time 0
set -g repeat-time 500
set -g focus-events on
set -g mouse on
setw -g mode-keys vi
# always: zsh never asks for extended keys, so with on Shift+Enter arrives as Enter and runs the line.
set -g extended-keys always
set -g extended-keys-format csi-u

# ─── Key Bindings ─────────────────────────────────────────────────────────────

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Split panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation
bind -r C-h previous-window
bind -r C-l next-window

# Swap windows
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# ─── Copy Mode ────────────────────────────────────────────────────────────────

bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ─── Luna Colors ──────────────────────────────────────────────────────────────

# Palette (matches .config/ghostty/themes/luna)
%hidden LUNA_BG="#060606"
%hidden LUNA_BG_DARK="#000000"
%hidden LUNA_BG_HL="#1c1c1c"
%hidden LUNA_FG="#e4e4e8"
%hidden LUNA_FG_DARK="#c7c7c7"
%hidden LUNA_BLUE="#75a1c7"
%hidden LUNA_CYAN="#75a1c7"
%hidden LUNA_GREEN="#6fbe80"
%hidden LUNA_MAGENTA="#c4a8d6"
%hidden LUNA_YELLOW="#c2916a"
%hidden LUNA_RED="#e08585"

# Pane borders
set -g pane-border-style "fg=#{LUNA_BG_HL}"
set -g pane-active-border-style "fg=#{LUNA_BLUE}"

# Messages
set -g message-style "fg=#{LUNA_CYAN},bg=#{LUNA_BG_HL}"
set -g message-command-style "fg=#{LUNA_CYAN},bg=#{LUNA_BG_HL}"

# Mode (copy mode, etc.)
set -g mode-style "fg=#{LUNA_CYAN},bg=#{LUNA_BG_HL}"

# ─── Status Bar ───────────────────────────────────────────────────────────────

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "fg=#{LUNA_FG_DARK},bg=#{LUNA_BG_DARK}"

# Left: session name
set -g status-left-length 30
set -g status-left "#[fg=#{LUNA_BG_DARK},bg=#{LUNA_BLUE},bold]  #S #[fg=#{LUNA_BLUE},bg=#{LUNA_BG_DARK}]"

# Right: time and date
set -g status-right-length 50
set -g status-right "#[fg=#{LUNA_BG_HL}]#[fg=#{LUNA_FG_DARK},bg=#{LUNA_BG_HL}] %H:%M #[fg=#{LUNA_BLUE}]#[fg=#{LUNA_BG_DARK},bg=#{LUNA_BLUE},bold] %b %d "

# Window status
set -g window-status-format "#[fg=#{LUNA_FG_DARK},bg=#{LUNA_BG_DARK}]  #I:#W  "
set -g window-status-current-format "#[fg=#{LUNA_BG_DARK},bg=#{LUNA_BG_HL}]#[fg=#{LUNA_CYAN},bg=#{LUNA_BG_HL},bold] #I:#W #[fg=#{LUNA_BG_HL},bg=#{LUNA_BG_DARK}]"
set -g window-status-separator ""

# ─── Plugins ─────────────────────────────────────────────────────────────

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
# Bootstrap TPM and the plugins above on a fresh machine
if-shell "test ! -d $HOME/.tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm $HOME/.tmux/plugins/tpm && $HOME/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'
