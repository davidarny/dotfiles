# macOS settings, applied with `just macos` through `defaults write`.
#
# Tables are [<scope>.<domain>]: `user` for the usual per-user domains,
# `currentHost` for per-machine ones (`defaults -currentHost`). Each key is
# written with the type of its TOML value; whole numbers become integers.
# A table value, like AppleSymbolicHotKeys, replaces the whole key.
#
# To find the key behind a control: run `just macos-diff`, change the setting
# in System Settings, run `just macos-diff` again, and paste what it prints.
# `just doctor` reports keys whose value on this machine differs.
#
# Not covered (set by hand or need sudo): privacy permissions, Touch ID,
# displays, Wi-Fi, login items, computer name, energy settings.

# Appearance, Desktop & Dock, Language & Region, Keyboard, Trackpad, Finder, Sound
[user.NSGlobalDomain]
AppleInterfaceStyle = "Dark"
AppleAccentColor = 4
AppleAquaColorVariant = 1
AppleIconAppearanceTheme = "RegularDark"
NSGlassTintAmount = 1
NSGlassBuddyTintAmount = 1
AppleActionOnDoubleClick = "Fill"
AppleMiniaturizeOnDoubleClick = false
NSCloseAlwaysConfirmsChanges = false
AppleLanguages = ["en-US", "ru-US"]
AppleLocale = "en_US"
KeyRepeat = 2
InitialKeyRepeat = 15
AppleKeyboardUIMode = 2
"com.apple.keyboard.fnState" = false
NSAutomaticCapitalizationEnabled = true
NSAutomaticPeriodSubstitutionEnabled = true
KB_DoubleQuoteOption = "“abc”"
KB_SingleQuoteOption = "‘abc’"
NSUserQuotesArray = ["“", "”", "‘", "’"]
AppleEnableSwipeNavigateWithScrolls = false
"com.apple.trackpad.forceClick" = true
"com.apple.springing.enabled" = true
"com.apple.springing.delay" = 0.5
AppleShowAllExtensions = true
"com.apple.sound.beep.flash" = 0

# Trackpad gestures, as System Settings stores them for this machine
[currentHost.NSGlobalDomain]
"com.apple.trackpad.enableSecondaryClick" = true
"com.apple.trackpad.fiveFingerPinchSwipeGesture" = 2
"com.apple.trackpad.fourFingerHorizSwipeGesture" = 0
"com.apple.trackpad.fourFingerPinchSwipeGesture" = 2
"com.apple.trackpad.fourFingerVertSwipeGesture" = 2
"com.apple.trackpad.momentumScroll" = true
"com.apple.trackpad.pinchGesture" = true
"com.apple.trackpad.rotateGesture" = true
"com.apple.trackpad.scrollBehavior" = 2
"com.apple.trackpad.threeFingerDragGesture" = false
"com.apple.trackpad.threeFingerHorizSwipeGesture" = 0
"com.apple.trackpad.threeFingerTapGesture" = 0
"com.apple.trackpad.threeFingerVertSwipeGesture" = 2
"com.apple.trackpad.twoFingerDoubleTapGesture" = 1
"com.apple.trackpad.twoFingerFromRightEdgeSwipeGesture" = 0

# Trackpad: built-in (AppleMultitouchTrackpad) and Bluetooth (the driver domain)
[user."com.apple.AppleMultitouchTrackpad"]
ActuateDetents = 1
