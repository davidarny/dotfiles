[mcp_servers.codegraph]
command = "codegraph"
args = ["serve", "--mcp"]

[mcp_servers.fff]
command = "/opt/homebrew/bin/fff-mcp"

[mcp_servers.fff.env]
FFF_MCP_IDLE_TIMEOUT_SECS = "0"

[mcp_servers.context7]
command = "bunx"
args = ["-y", "@upstash/context7-mcp@latest"]
env_vars = ["CONTEXT7_API_KEY"]

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp"
env_http_headers = { x-api-key = "EXA_API_KEY" }

[mcp_servers.hindsight]
url = "https://api.hindsight.vectorize.io/mcp/shared-memory/"
bearer_token_env_var = "HINDSIGHT_MCP_TOKEN"

[mcp_servers.atlassian-jira-dc]
command = "bunx"
args = ["-y", "@atlassian-dc-mcp/jira@latest"]
env_vars = ["JIRA_API_TOKEN"]
startup_timeout_sec = 120.0

[mcp_servers.atlassian-jira-dc.env]
JIRA_HOST = "jira.dats.tech"

[mcp_servers.atlassian-confluence-dc]
command = "bunx"
args = ["-y", "@atlassian-dc-mcp/confluence@latest"]
env_vars = ["CONFLUENCE_API_TOKEN"]
startup_timeout_sec = 120.0

[mcp_servers.atlassian-confluence-dc.env]
CONFLUENCE_HOST = "confluence.dats.tech"

[mcp_servers.grafana]
command = "/opt/homebrew/bin/mcp-grafana"
env_vars = ["GRAFANA_API_KEY"]
startup_timeout_sec = 120.0

[mcp_servers.grafana.env]
GRAFANA_URL = "https://grafana.dats.services"

[mcp_servers.elasticsearch-main]
command = "uvx"
args = ["--python", "3.12", "elasticsearch-mcp-server@latest"]
env_vars = ["ELASTICSEARCH_PASSWORD"]

[mcp_servers.elasticsearch-main.env]
ELASTICSEARCH_HOSTS = "https://elastic-logs-htzn-2.infra.dats.host:9200,https://elastic-logs-htzn-3.infra.dats.host:9200,https://elastic-logs-htzn-4.infra.dats.host:9200"
ELASTICSEARCH_USERNAME = "d.arutyunyan"
DISABLE_HIGH_RISK_OPERATIONS = "true"
VERIFY_CERTS = "false"

[mcp_servers.mostbet-elasticsearch]
command = "uvx"
args = ["--python", "3.12", "elasticsearch-mcp-server@latest"]
env_vars = ["ELASTICSEARCH_PASSWORD"]

[mcp_servers.mostbet-elasticsearch.env]
ELASTICSEARCH_HOSTS = "https://elastic-logs-mostbet-frnx-1.prod.dats.host:9200"
ELASTICSEARCH_USERNAME = "d.arutyunyan"
DISABLE_HIGH_RISK_OPERATIONS = "true"
VERIFY_CERTS = "false"

[mcp_servers.testrail]
command = "uvx"
args = ["testrail-mcp@latest"]
env_vars = ["TESTRAIL_API_KEY"]

[mcp_servers.testrail.env]
TESTRAIL_URL = "http://media.test8bit.com/testrail"
TESTRAIL_USERNAME = "readonly@8bitov.com"

[mcp_servers.minio]
command = "bunx"
args = ["-y", "github:chenchiwei/s3-mcp-server#ceebf773d6881fb6cd3abc80709088d4792518c6"]
env_vars = ["AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY"]

[mcp_servers.minio.env]
AWS_ENDPOINT_URL = "https://minio-synthetic-tests-perf.infra.dats.host"
AWS_REGION = "eu-west-1"
ALLOW_WRITE = "false"

[mcp_servers.openai-developer-docs]
url = "https://developers.openai.com/mcp"

[mcp_servers.claude-agent-broker]
url = "http://127.0.0.1:8765/mcp"

[mcp_servers.proxyman]
command = "/Applications/Proxyman.app/Contents/MacOS/mcp-server"
enabled = false
